<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>雙面文字 3D 錯視 + 底座 - BV6LC / DANLEE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 20px; background: #16213e; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 1.1rem; color: #e94560; }
  .info { font-size: 0.8rem; color: #aaa; }
  .controls { display: flex; gap: 8px; margin-left: auto; }
  button {
    padding: 7px 14px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.85rem; font-weight: bold;
  }
  #btnRotate { background: #0f3460; color: #eee; }
  #btnRotate.active { background: #e94560; }
  #btnExport { background: #28a745; color: #fff; }
  #viewLabels { display: flex; gap: 20px; padding: 6px 20px; font-size: 0.78rem; background: #0d1117; }
  .vl { color: #888; }
  .vl span { color: #e94560; font-weight: bold; }
  #canvas3d { flex: 1; display: block; }
  #status { position: fixed; bottom: 10px; right: 14px; font-size: 0.75rem; color: #666; }
</style>
</head>
<body>
<header>
  <h1>雙面文字 3D 錯視 + 底座</h1>
  <div class="info">正面 → BV6LC &nbsp;|&nbsp; 側面（旋轉 90°）→ DANLEE</div>
  <div class="controls">
    <button id="btnRotate">自動旋轉</button>
    <button id="btnExport">匯出 STL</button>
  </div>
</header>
<div id="viewLabels">
  <div class="vl">目前角度：<span id="angleLabel">正面 (BV6LC)</span></div>
  <div class="vl">拖曳滑鼠旋轉 &nbsp;|&nbsp; 滾輪縮放</div>
</div>
<canvas id="canvas3d"></canvas>
<div id="status">產生中... <span id="modTime"></span></div>

<script type="module">
// ─── Three.js via CDN ───────────────────────────────────────────────────────
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const STATUS = document.getElementById('status');
const ANGLE_LABEL = document.getElementById('angleLabel');

// ─── Scene setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 8);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
dirLight2.position.set(-5, 5, -8);
scene.add(dirLight2);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
camera.position.set(0, 0, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotateSpeed = 1.0;

// ─── Config ────────────────────────────────────────────────────────────────────
// 底座參數
const BASE_THICKNESS = 8;    // 底座厚度
const BASE_EXTEND_X = 15;      // 底座左右延伸
const BASE_EXTEND_Z = 15;     // 底座前後延伸
const SLANT_HEIGHT = 12;      // 後方比前方高多少（前低後高）
const WALL_HEIGHT = 6;        // 前方擋板高度
const WALL_THICKNESS = 4;     // 擋板厚度

// 文字網格參數
const FONT = 'bold 48px Arial Black, Arial';
const GRID_W = 200;
const GRID_H = 60;
const GRID_D = 200;

function textToGrid(text, width = GRID_W, height = GRID_H) {
  const c = document.createElement('canvas');
  c.width = width; c.height = height;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#fff';
  ctx.font = FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, width / 2, height / 2);
  const data = ctx.getImageData(0, 0, width, height).data;
  const grid = [];
  for (let y = 0; y < height; y++) {
    grid[y] = [];
    for (let x = 0; x < width; x++) {
      grid[y][x] = data[(y * width + x) * 4] > 128;
    }
  }
  return { grid, width, height };
}

// ─── 建立 vox 列表（含位置偏移） ────────────────────────────────────────────
function buildVoxels(frontText, sideText) {
  const GW = GRID_W, GH = GRID_H, GD = GRID_D;
  const { grid: fg } = textToGrid(frontText, GW, GH);
  const { grid: sg } = textToGrid(sideText, GD, GH);
  
  const positions = [];
  const voxSize = 1;
  
  // 原點偏移 (文字置中)
  const ox = -GW / 2, oy = -GH / 2, oz = -GD / 2;
  
  // 第一部分：交集體素
  for (let iy = 0; iy < GH; iy++) {
    for (let ix = 0; ix < GW; ix++) {
      if (!fg[iy][ix]) continue;
      for (let iz = 0; iz < GD; iz++) {
        if (!sg[iy][iz]) continue;
        // 加入 slant：前方(iy較大)較低，後方較高
        const slantOffset = Math.floor((iy / GH) * SLANT_HEIGHT);
        positions.push({
          x: ox + ix + 0.5,
          y: -(oy + iy + 0.5) - BASE_THICKNESS + slantOffset,
          z: oz + iz + 0.5
        });
      }
    }
  }
  
  // 第二部分：底座（平坦平台）
  // 底座範圍：涵蓋文字範圍並延伸
  const minX = ox, maxX = ox + GW;
  const minY = -BASE_THICKNESS, maxY = 0;
  const minZ = oz, maxZ = oz + GD;
  
  // 左側底座
  for (let y = minY; y < 0; y++) {
    for (let x = minX - BASE_EXTEND_X; x < minX; x++) {
      for (let z = minZ - BASE_EXTEND_Z; z < maxZ + BASE_EXTEND_Z; z++) {
        positions.push({ x: x + 0.5, y: y + 0.5, z: z + 0.5 });
      }
    }
  }
  // 右側底座
  for (let y = minY; y < 0; y++) {
    for (let x = maxX; x < maxX + BASE_EXTEND_X; x++) {
      for (let z = minZ - BASE_EXTEND_Z; z < maxZ + BASE_EXTEND_Z; z++) {
        positions.push({ x: x + 0.5, y: y + 0.5, z: z + 0.5 });
      }
    }
  }
  // 前側底座（在文字前方）
  for (let y = minY; y < 0; y++) {
    for (let x = minX; x < maxX; x++) {
      for (let z = maxZ; z < maxZ + BASE_EXTEND_Z; z++) {
        positions.push({ x: x + 0.5, y: y + 0.5, z: z + 0.5 });
      }
    }
  }
  // 後側底座
  for (let y = minY; y < 0; y++) {
    for (let x = minX; x < maxX; x++) {
      for (let z = minZ - BASE_EXTEND_Z; z < minZ; z++) {
        positions.push({ x: x + 0.5, y: y + 0.5, z: z + 0.5 });
      }
    }
  }
  // 底部完整填充
  for (let x = minX - BASE_EXTEND_X; x < maxX + BASE_EXTEND_X; x++) {
    for (let z = minZ - BASE_EXTEND_Z; z < maxZ + BASE_EXTEND_Z; z++) {
      positions.push({ x: x + 0.5, y: minY + 0.5, z: z + 0.5 });
    }
  }
  
  // 第三部分：前方擋板（防止小電台滑落）
  // 擋板位置：在最前方，高度和厚度
  const wallZ = maxZ + BASE_EXTEND_Z - WALL_THICKNESS;
  for (let y = 0; y < WALL_HEIGHT; y++) {
    for (let x = minX + 10; x < maxX - 10; x++) {
      positions.push({
        x: x + 0.5,
        y: y + 0.5 - BASE_THICKNESS + SLANT_HEIGHT, // 加上 slant 偏移
        z: wallZ + 0.5
      });
    }
  }
  
  return positions;
}

// ─── 建立 InstancedMesh ──────────────────────────────────────────────────
function buildModelMesh(frontText, sideText) {
  const positions = buildVoxels(frontText, sideText);
  if (positions.length === 0) return null;
  
  const dummy = new THREE.Object3D();
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshPhongMaterial({ 
    color: 0xe94560,
    specular: 0x333333,
    shininess: 30
  });
  const mesh = new THREE.InstancedMesh(boxGeo, mat, positions.length);
  
  for (let i = 0; i < positions.length; i++) {
    dummy.position.set(positions[i].x, positions[i].y, positions[i].z);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ─── 建立場景物件 ────────────────────────────────────────────────────────────
STATUS.textContent = '計算體素中...';
let modelMesh = null;

setTimeout(() => {
  modelMesh = buildModelMesh('BV6LC', 'DANLEE');
  if (modelMesh) {
    scene.add(modelMesh);
    STATUS.textContent = `體素數：${modelMesh.count}（含底座）`;
  document.getElementById('modTime').textContent = '｜版本 2026-06-02 17:48';
  } else {
    STATUS.textContent = '錯誤：無法建立模型';
  }
}, 50);

// ─── 視角參考框 ────────────────────────────────────────────────────────────
const boxHelper = new THREE.BoxHelper(new THREE.Mesh(
  new THREE.BoxGeometry(GRID_W + BASE_EXTEND_X * 2, BASE_THICKNESS + GRID_H + SLANT_HEIGHT + WALL_HEIGHT, GRID_D + BASE_EXTEND_Z * 2)
), 0x333366);
boxHelper.position.y = (GRID_H - BASE_THICKNESS) / 2;
scene.add(boxHelper);

// ─── 地面參照 ────────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(300, 300);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x0d1117 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -BASE_THICKNESS - 0.5;
ground.receiveShadow = true;
scene.add(ground);

// ─── 自動旋轉 ────────────────────────────────────────────────────────────────
let autoRotate = false;
document.getElementById('btnRotate').addEventListener('click', (e) => {
  autoRotate = !autoRotate;
  e.target.classList.toggle('active', autoRotate);
  controls.autoRotate = autoRotate;
});

// ─── Resize ──────────────────────────────────────────────────────────────────
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
resize();

// ─── 角度 label ──────────────────────────────────────────────────────────────
function updateAngleLabel() {
  const az = ((controls.getAzimuthalAngle() * 180 / Math.PI) % 360 + 360) % 360;
  const near90 = Math.abs(az - 90) < 20 || Math.abs(az - 270) < 20;
  ANGLE_LABEL.textContent = near90 ? '側面 (DANLEE)' : '正面 (BV6LC)';
}

// ─── Render loop ───────────────────────────────���─���───────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateAngleLabel();
  renderer.render(scene, camera);
}
animate();

// ─── STL 匯出 ────────────────────────────────────────────────────────────────
document.getElementById('btnExport').addEventListener('click', () => {
  if (!modelMesh) return alert('模型尚未建立完成');
  STATUS.textContent = '匯出 STL 中...';
  
  setTimeout(() => {
    const merged = mergeInstancedMesh(modelMesh);
    const stlBinary = geometryToSTLBinary(merged);
    
    const blob = new Blob([stlBinary], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'BV6LC_DANLEE_base.stl';
    a.click();
    STATUS.textContent = 'STL 已下載';
  }, 100);
});

function mergeInstancedMesh(instMesh) {
  const geo = instMesh.geometry.clone();
  const posAttr = geo.attributes.position;
  const vCount = posAttr.count;
  const fCount = instMesh.count * 36; // 每個 box 36 個三角形
  
  const allPos = new Float32Array(vCount * 3);
  const allNorm = new Float32Array(vCount * 3);
  const allIdx = new Uint32Array(fCount);
  
  const dummy = new THREE.Object3D();
  const normMat = new THREE.Matrix3();
  const v = new THREE.Vector3();
  const mat = new THREE.Matrix4();
  
  // 收集實例矩陣
  const matrices = [];
  for (let i = 0; i < instMesh.count; i++) {
    instMesh.getMatrixAt(i, mat);
    matrices.push(mat.clone());
  }
  
  // 合併位置
  for (let vi = 0; vi < vCount; vi++) {
    v.fromBufferAttribute(posAttr, vi);
    // 找出在哪個實例
    const instanceIdx = Math.floor(vi / vCount);
    if (matrices[instanceIdx]) {
      v.applyMatrix4(matrices[instanceIdx]);
    }
    allPos[vi * 3] = v.x;
    allPos[vi * 3 + 1] = v.y;
    allPos[vi * 3 + 2] = v.z;
  }
  
  // 產生索引
  for (let i = 0; i < instMesh.count; i++) {
    const base = i * vCount;
    for (let j = 0; j < vCount; j++) {
      allIdx[i * vCount + j] = base + j;
    }
  }
  
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(allPos, 3));
  out.setIndex(new THREE.BufferAttribute(allIdx, 1));
  out.computeVertexNormals();
  return out;
}

function geometryToSTLBinary(geo) {
  const pos = geo.attributes.position;
  const idx = geo.index;
  const triCount = idx ? idx.count / 3 : pos.count / 3;
  const buf = new ArrayBuffer(84 + triCount * 50);
  const view = new DataView(buf);
  
  const header = 'BV6LC DANLEE with base';
  for (let i = 0; i < 80; i++) view.setUint8(i, header.charCodeAt(i) || 0);
  view.setUint32(80, triCount, true);
  
  const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
  const n = new THREE.Vector3();
  let offset = 84;
  
  for (let t = 0; t < triCount; t++) {
    const ia = idx ? idx.getX(t * 3) : t * 3;
    const ib = idx ? idx.getX(t * 3 + 1) : t * 3 + 1;
    const ic = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
    va.fromBufferAttribute(pos, ia);
    vb.fromBufferAttribute(pos, ib);
    vc.fromBufferAttribute(pos, ic);
    n.crossVectors(vb.clone().sub(va), vc.clone().sub(va)).normalize();
    
    view.setFloat32(offset, n.x, true); offset += 4;
    view.setFloat32(offset, n.y, true); offset += 4;
    view.setFloat32(offset, n.z, true); offset += 4;
    for (const v of [va, vb, vc]) {
      view.setFloat32(offset, v.x, true); offset += 4;
      view.setFloat32(offset, v.y, true); offset += 4;
      view.setFloat32(offset, v.z, true); offset += 4;
    }
    view.setUint16(offset, 0, true); offset += 2;
  }
  
  return buf;
}
</script>
</body>
</html>
